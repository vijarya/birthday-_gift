<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Happy Birthday!</title>
<style>
  /* Basic reset */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body, html {
    height: 100%;
    overflow-x: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #fbc7a4, #ffdde1);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  }

  .container {
    position: relative;
    max-width: 480px;
    width: 100%;
    padding: 30px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 15px 25px rgba(0,0,0,0.2);
  }

  h1 {
    font-size: 2.8rem;
    color: #e91e63;
    margin-bottom: 10px;
  }

  p {
    font-size: 1.3rem;
    color: #555;
    margin-bottom: 25px;
  }

  /* Confetti container */
  .confetti {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    overflow: visible;
    z-index: 9999;
  }

  .confetti-piece {
    position: absolute;
    width: 10px;
    height: 10px;
    background-color: #e91e63;
    opacity: 0.85;
    border-radius: 3px;
    animation-name: confetti-fall, confetti-spin;
    animation-timing-function: linear, ease-in-out;
    animation-iteration-count: infinite, infinite;
    animation-duration: 4s, 1.5s;
  }

  /* Different colors */
  .confetti-piece:nth-child(odd) {
    background-color: #ffeb3b;
  }

  .confetti-piece:nth-child(4n) {
    background-color: #03a9f4;
  }

  .confetti-piece:nth-child(3n) {
    background-color: #8bc34a;
  }

  /* Animations */
  @keyframes confetti-fall {
    0% {
      transform: translateY(0) translateX(0);
      opacity: 1;
    }
    100% {
      transform: translateY(100vh) translateX(50px);
      opacity: 0;
    }
  }

  @keyframes confetti-spin {
    0% {
      transform: rotate(0deg);
    }
    50% {
      transform: rotate(180deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }
</style>
</head>
<body>

<div class="confetti" id="confetti"></div>

<div class="container">
  <h1>Happy Birthday!</h1>
  <p>Wishing you a day filled with love, joy, and wonderful surprises.</p>
  <p>Enjoy every moment of your special day!</p>
</div>

<script>
  const confettiContainer = document.getElementById('confetti');

  function createConfettiPiece() {
    const confetti = document.createElement('div');
    confetti.classList.add('confetti-piece');

    confetti.style.left = Math.random() * window.innerWidth + 'px';
    confetti.style.animationDuration = (4 + Math.random() * 3) + 's';
    confetti.style.opacity = Math.random() + 0.5;
    confetti.style.width = confetti.style.height = (5 + Math.random() * 10) + 'px';

    confettiContainer.appendChild(confetti);

    setTimeout(() => {
      confetti.remove();
    }, 7000);
  }

  // Generate confetti continuously
  setInterval(createConfettiPiece, 200);
</script>

</body>
</html>
